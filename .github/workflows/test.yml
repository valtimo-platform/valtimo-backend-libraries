name: Run tests
on:
    pull_request:
        types: [synchronize, opened]

jobs:
    determine-unit-tests:
        runs-on: ubuntu-latest
        outputs:
            unit_test_matrix: ${{ steps.set_unit_test_matrix.outputs.matrix }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: "Setup jq"
              uses: dcarbone/install-jq-action@v3
            - id: set_unit_test_matrix
              run: |
                  DRY_RUN=$(./gradlew test --dry-run)
                  TESTS_FILE='/tmp/unit_tests'
                  touch $TESTS_FILE
                  while IFS= read -r line; do
                    if [[ $line =~ (:[^[:space:]]+:test)\  ]]; then
                      echo "$line" | cut -d ' ' -f 1 >> $TESTS_FILE
                    fi
                  done <<< "$DRY_RUN"
                  MATRIX=$(jq -R -s -c 'split("\n")[:-1]' < $TESTS_FILE)
                  echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

    unit-testing:
        needs: [determine-unit-tests]
        runs-on: ubuntu-latest
        strategy:
            matrix:
                unit_test_suite: ${{ fromJson(needs.determine-unit-tests.outputs.unit_test_matrix) }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "21"
            - name: Run Unit Tests
              run: ./gradlew ${{ matrix.unit_test_suite }}

    determine-integration-tests:
        runs-on: ubuntu-latest
        outputs:
            integration_test_matrix: ${{ steps.set_integration_test_matrix.outputs.matrix }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: "Setup jq"
              uses: dcarbone/install-jq-action@v3
            - id: set_integration_test_matrix
              run: |
                  DRY_RUN=$(./gradlew integrationTesting --dry-run)
                  TESTS_FILE='/tmp/tests'
                  touch $TESTS_FILE
                  while IFS= read -r line; do
                    if [[ $line =~ (:[^[:space:]]+:integrationTesting)\  ]]; then
                      echo "$line" | cut -d ' ' -f 1 >> $TESTS_FILE
                    fi
                  done <<< "$DRY_RUN"
                  MATRIX=$(jq -R -s -c 'split("\n")[:-1]' < $TESTS_FILE)
                  echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

    # Runs all integration test suites in parallel
    integration-testing:
        runs-on: ubuntu-latest
        needs: [determine-integration-tests]
        strategy:
            matrix:
                integration_test_suite: ${{ fromJson(needs.determine-integration-tests.outputs.integration_test_matrix) }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Run integration test suite
              run: ./gradlew ${{ matrix.integration_test_suite }}

    determine-security-tests:
        runs-on: ubuntu-latest
        outputs:
            security_test_matrix: ${{ steps.set_security_test_matrix.outputs.matrix }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: "Setup jq"
              uses: dcarbone/install-jq-action@v3
            - id: set_security_test_matrix
              run: |
                  DRY_RUN=$(./gradlew securityTesting --dry-run)
                  TESTS_FILE='/tmp/securityTests'
                  touch $TESTS_FILE
                  while IFS= read -r line; do
                    if [[ $line =~ (:[^[:space:]]+:securityTesting)\  ]]; then
                      echo "$line" | cut -d ' ' -f 1 >> $TESTS_FILE
                    fi
                  done <<< "$DRY_RUN"
                  MATRIX=$(jq -R -s -c 'split("\n")[:-1]' < $TESTS_FILE)
                  echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

    security-testing:
        needs: [determine-security-tests]
        strategy:
            matrix:
                security_test_suite: ${{ fromJson(needs.determine-determine-security-tests.outputs.matrix) }}
        if: |
            github.ref_type == 'branch' && (
              startsWith(github.ref_name, 'development/') ||
              startsWith(github.ref_name, 'rc/') ||
              startsWith(github.ref_name, 'release/') ||
              github.ref_name == 'next-minor' ||
              github.ref_name == 'next-major' ||
              (
                github.actor != 'github-actions[bot]' &&
                !startsWith(github.ref_name, 'PR-') &&
                !startsWith(github.ref_name, 'poc/')
              )
            )
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "21"
            - name: Run Security Tests
              run: ./gradlew ${{ matrix.security_test_suite }}
